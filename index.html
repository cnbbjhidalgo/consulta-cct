<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Asambleas Informativas - Hidalgo</title>

<style>

body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f4f4;
  color:#333;
}

.contenedor{
  max-width:850px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:30px;
  box-shadow:0 4px 15px rgba(0,0,0,0.12);
  text-align:center;
}

.logo{
  max-width:320px;
  max-height:180px;
  width:auto;
  height:auto;
  object-fit:contain;
  margin-bottom:20px;
}

h1{
  color:#7a1f3d;
  font-size:28px;
  line-height:1.3;
  margin:10px 0 15px;
}

.subtitulo{
  font-size:17px;
  margin-bottom:25px;
  color:#555;
}

input{
  width:90%;
  max-width:450px;
  padding:14px;
  font-size:18px;
  border:1px solid #bbb;
  border-radius:8px;
  box-sizing:border-box;
  text-transform:uppercase;
  margin-bottom:15px;
}

button{
  background:#7a1f3d;
  color:white;
  border:none;
  padding:14px 30px;
  font-size:17px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#5f1830;
}

#mensaje{
  margin-top:20px;
  font-weight:bold;
}

.resultado{
  margin-top:25px;
  text-align:left;
  background:#fafafa;
  border-left:6px solid #7a1f3d;
  border-radius:8px;
  padding:20px;
}

.resultado h2{
  color:#7a1f3d;
  margin-top:0;
}

.dato{
  margin:10px 0;
  font-size:16px;
}

.dato strong{
  color:#7a1f3d;
}

.imagenInferior{
  margin-top:30px;
}

.imagenInferior img{
  width:100%;
  max-width:800px;
  height:auto;
  border-radius:12px;
  display:block;
  margin:0 auto;
}

.oculto{
  display:none;
}

@media(max-width:600px){

  .contenedor{
    margin:10px auto;
    padding:10px;
  }

  .card{
    padding:20px 15px;
  }

  h1{
    font-size:23px;
  }

  .subtitulo{
    font-size:15px;
  }

  .logo{
    max-width:250px;
    max-height:140px;
  }

  input{
    width:100%;
  }

  button{
    width:100%;
  }

}

</style>
</head>


<body>

<div class="contenedor">

  <div class="card">

    <!-- IMAGEN INICIAL -->
    <img
      id="logoPrincipal"
      class="logo"
      src="CNBBBJ.png"
      alt="CNBBBJ"
    >

    <!-- TITULO -->
    <h1 id="tituloPrincipal">
      Asambleas Informativas<br>
      Beca Universal de Educación Media Superior "Benito Juárez"<br>
      y Jóvenes Escribiendo el Futuro<br>
      Hidalgo
    </h1>

    <div class="subtitulo">
      Coloca la clave de la escuela para conocer la programación.
    </div>


    <!-- BUSCADOR -->
    <input
      type="text"
      id="cct"
      placeholder="Ejemplo: 13EBH0000X"
      maxlength="15"
    >

    <br>

    <button onclick="consultarCCT()">
      Consultar
    </button>


    <!-- MENSAJE -->
    <div id="mensaje"></div>


    <!-- RESULTADO -->
    <div
      id="resultado"
      class="resultado oculto"
    >

      <h2>Información de la escuela</h2>

      <div class="dato">
        <strong>Escuela:</strong>
        <span id="escuela"></span>
      </div>

      <div class="dato">
        <strong>Atención:</strong>
        <span id="atencion"></span>
      </div>

      <div class="dato">
        <strong>Sede:</strong>
        <span id="sede"></span>
      </div>

      <div class="dato">
        <strong>Dirección:</strong>
        <span id="direccion"></span>
      </div>

    </div>


    <!-- IMAGEN INFERIOR -->
    <div
      id="imagenInferior"
      class="imagenInferior"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   URL DE TU GOOGLE APPS SCRIPT
   ===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbzzV64AGsFJNJ6YCDQg5qIDX-Lmnd3DDYGewrMVrKuA-PCuFuolZ9jQgb8ErOmFKP4L/exec";


/* =====================================================
   ELEMENTOS DE LA PÁGINA
   ===================================================== */

const cctInput = document.getElementById("cct");
const mensaje = document.getElementById("mensaje");
const resultado = document.getElementById("resultado");

const escuela = document.getElementById("escuela");
const atencion = document.getElementById("atencion");
const sede = document.getElementById("sede");
const direccion = document.getElementById("direccion");

const logoPrincipal = document.getElementById("logoPrincipal");
const tituloPrincipal = document.getElementById("tituloPrincipal");
const imagenInferior = document.getElementById("imagenInferior");


/* =====================================================
   TITULO ORIGINAL
   ===================================================== */

const tituloOriginal = `
Asambleas Informativas<br>
Beca Universal de Educación Media Superior "Benito Juárez"<br>
y Jóvenes Escribiendo el Futuro<br>
Hidalgo
`;


/* =====================================================
   FUNCIÓN PARA CAMBIAR LOGO, TITULO E IMAGEN
   ===================================================== */

function cambiarPrograma(programa){

  const programaLimpio = String(programa || "")
    .trim()
    .toUpperCase();


  /* ==========================================
     S311 - EDUCACIÓN MEDIA SUPERIOR
     ========================================== */

  if(programaLimpio === "S311"){

    logoPrincipal.src = "LOGO EMS.png";

    tituloPrincipal.innerHTML = `
      Asambleas Informativas<br>
      Beca Universal de Educación Media Superior "Benito Juárez"
    `;

    imagenInferior.innerHTML = `
      <img
        src="EMS.jpeg"
        alt="Beca Universal de Educación Media Superior Benito Juárez"
      >
    `;

  }


  /* ==========================================
     S283 - JÓVENES ESCRIBIENDO EL FUTURO
     ========================================== */

  else if(programaLimpio === "S283"){

    logoPrincipal.src = "LOGO JEF.png";

    tituloPrincipal.innerHTML = `
      Asambleas Informativas<br>
      Beca Jóvenes Escribiendo el Futuro
    `;

    imagenInferior.innerHTML = `
      <img
        src="JEF.jpeg"
        alt="Beca Jóvenes Escribiendo el Futuro"
      >
    `;

  }


  /* ==========================================
     S072 - EDUCACIÓN BÁSICA
     ========================================== */

  else if(programaLimpio === "S072"){

    logoPrincipal.src = "LOGO BASICA.png";

    tituloPrincipal.innerHTML = `
      Asambleas Informativas<br>
      Beca Universal de Educación Básica Rita Cetina Gutiérrez
    `;

    imagenInferior.innerHTML = `
      <img
        src="BASICA.jpeg"
        alt="Beca Universal de Educación Básica Rita Cetina"
      >
    `;

  }


  /* ==========================================
     SI NO SE RECONOCE EL PROGRAMA
     ========================================== */

  else{

    logoPrincipal.src = "CNBBBJ.png";

    tituloPrincipal.innerHTML = tituloOriginal;

    imagenInferior.innerHTML = "";

  }

}


/* =====================================================
   FUNCIÓN PRINCIPAL DE CONSULTA
   ===================================================== */

async function consultarCCT(){

  const cctBuscado = cctInput.value
    .trim()
    .toUpperCase();


  /* ==========================================
     VALIDAR QUE SE HAYA ESCRITO UN CCT
     ========================================== */

  if(!cctBuscado){

    mensaje.style.color = "#7a1f3d";
    mensaje.textContent = "Por favor, coloca una clave CCT.";

    resultado.classList.add("oculto");

    return;
  }


  /* ==========================================
     MENSAJE DE CARGA
     ========================================== */

  mensaje.style.color = "#555";
  mensaje.textContent = "Consultando información...";

  resultado.classList.add("oculto");


  try{

    /* ==========================================
       CONSULTA AL GOOGLE APPS SCRIPT
       ========================================== */

    const url =
      URL_SCRIPT +
      "?cct=" +
      encodeURIComponent(cctBuscado) +
      "&t=" +
      new Date().getTime();


    const respuesta = await fetch(url);


    if(!respuesta.ok){

      throw new Error(
        "No fue posible comunicarse con el servidor."
      );

    }


    const datos = await respuesta.json();


    /* ==========================================
       CCT NO ENCONTRADO
       ========================================== */

    if(datos.error){

      mensaje.style.color = "#7a1f3d";
      mensaje.textContent = datos.error;

      resultado.classList.add("oculto");

      return;
    }


    /* ==========================================
       MOSTRAR INFORMACIÓN
       ========================================== */

    escuela.textContent =
      datos.escuela || "Pendiente";

    atencion.textContent =
      datos.atencion || "Pendiente";

    sede.textContent =
      datos.sede || "Pendiente";

    direccion.textContent =
      datos.direccion || "Pendiente";


    /* ==========================================
       CAMBIAR SEGÚN EL PROGRAMA
       ========================================== */

    cambiarPrograma(datos.columnaC);


    /* ==========================================
       MOSTRAR RESULTADO
       ========================================== */

    resultado.classList.remove("oculto");

    mensaje.textContent = "";


    /* ==========================================
       LLEVAR LA PANTALLA AL RESULTADO
       ========================================== */

    resultado.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }


  catch(error){

    console.error(error);

    mensaje.style.color = "#7a1f3d";

    mensaje.textContent =
      "Ocurrió un error al realizar la consulta. Intenta nuevamente.";

    resultado.classList.add("oculto");

  }

}


/* =====================================================
   PERMITIR CONSULTAR CON LA TECLA ENTER
   ===================================================== */

cctInput.addEventListener("keypress", function(event){

  if(event.key === "Enter"){

    consultarCCT();

  }

});

</script>

</body>
</html>
