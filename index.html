<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asambleas Informativas Beca Universal de Educación Media Superior “Benito Juárez” y Jóvenes Escribiendo el Futuro Hidalgo</title>

<style>
body{
  margin:0;
  padding:0;
  font-family: Arial, sans-serif;
  background:#f7f2f4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:550px;
  background:white;
  border-radius:25px;
  padding:35px;
  box-shadow:0 5px 20px rgba(0,0,0,0.12);
  text-align:center;
}

h1{
  color:#7a1f3d;
  font-size:34px;
  margin-bottom:10px;
  line-height:1.4;
}

.subtitulo{
  font-size:20px;
  color:#444;
  margin-bottom:30px;
  line-height:1.5;
}

input{
  width:100%;
  padding:18px;
  font-size:24px;
  border-radius:15px;
  border:2px solid #d6c5cb;
  box-sizing:border-box;
  text-align:center;
}

input:focus{
  outline:none;
  border-color:#7a1f3d;
  box-shadow:0 0 8px rgba(122,31,61,0.25);
}

button{
  width:100%;
  margin-top:20px;
  padding:18px;
  background:#7a1f3d;
  color:white;
  border:none;
  border-radius:15px;
  font-size:26px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#5e1730;
}

.card{
  margin-top:30px;
  background:#faf5f7;
  border-radius:20px;
  padding:25px;
  text-align:left;
  border:1px solid #eadde2;
}

.card h2{
  color:#7a1f3d;
  margin-top:0;
  margin-bottom:20px;
}

.item{
  margin-bottom:18px;
  font-size:20px;
  color:#333;
  line-height:1.5;
}

.icon{
  font-size:24px;
  margin-right:10px;
}

.error{
  margin-top:20px;
  color:#c62828;
  font-size:22px;
  font-weight:bold;
}

.loader{
  margin-top:20px;
  font-size:22px;
  color:#7a1f3d;
}

.footer{
  margin-top:25px;
  font-size:16px;
  color:#777;
}

/* Estilo para la imagen ubicada debajo del resultado */
.imagen-inferior{
  width:100%;
  max-width:280px;
  height:auto;
  margin:25px auto 0 auto;
  display:block;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Imagen principal -->
  <img
    id="logoPrincipal"
    src="CNBBBJ.png"
    alt="Logo Principal"
    style="max-width: 100%; height: auto; margin-bottom: 15px;"
  >

  <h1 id="tituloPrincipal">
    Asambleas Informativas
    <br>
    Beca Universal de Educación Media Superior "Benito Juárez"
    <br>
    Hidalgo
  </h1>

  <div class="subtitulo">
    Coloca la clave de la escuela para conocer la programación.
  </div>

  <input
    type="text"
    id="cct"
    placeholder="Ingresa tu CCT"
  >

  <button onclick="buscar()">
    🔎 CONSULTAR
  </button>

  <div id="resultado"></div>

  <div class="footer">
    Becas Bienestar<br>
    Coordinación Nacional<br>
    Hidalgo
  </div>

</div>

<script>

async function buscar(){

  const cct = document
    .getElementById("cct")
    .value
    .trim()
    .toUpperCase();

  const div = document.getElementById("resultado");

  const logoPrincipal =
    document.getElementById("logoPrincipal");

  const tituloPrincipal =
    document.getElementById("tituloPrincipal");


  const tituloOriginal = `
    Asambleas Informativas
    <br>
    Beca Universal de Educación Media Superior "Benito Juárez"
    <br>
    Hidalgo
  `;


  const logoOriginal = "CNBBBJ.png";


  function resetDefault(){

    logoPrincipal.src = logoOriginal;

    tituloPrincipal.innerHTML =
      tituloOriginal;

  }


  if(!cct){

    div.innerHTML = `
      <p class="error">
        ⚠️ Ingresa tu CCT
      </p>
    `;

    resetDefault();

    return;
  }


  div.innerHTML = `
    <p class="loader">
      ⏳ Consultando información...
    </p>
  `;


  /*
   * URL ACTUAL DEL APPS SCRIPT
   */
  const url =
    "https://script.google.com/macros/s/AKfycbwydTBQfHY16ayA-Jv4de5BdbtGRZTzWF5zf0EDLXP-_hukFdnsPaEMnpGSYAoeDyuI/exec";


  try{

    const respuesta = await fetch(
      url +
      "?cct=" +
      encodeURIComponent(cct) +
      "&t=" +
      new Date().getTime(),
      {
        cache:"no-store"
      }
    );


    const datos =
      await respuesta.json();


    if(datos.error){

      div.innerHTML = `
        <p class="error">
          ❌ ${datos.error}
        </p>
      `;

      resetDefault();

    }else{

      let imagenInferiorHTML = "";


      /*
       * PROGRAMA S311
       */
      if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S311"
      ){

        tituloPrincipal.innerHTML = `
          Asambleas Informativas
          <br>
          Beca Universal de Educación Media Superior "Benito Juárez"
        `;

        logoPrincipal.src =
          "LOGO EMS.png";


        imagenInferiorHTML = `
          <img
            src="EMS.jpeg"
            alt="Logo EMS"
            class="imagen-inferior"
          >
        `;

      }


      /*
       * PROGRAMA S283
       */
      else if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S283"
      ){

        tituloPrincipal.innerHTML = `
          Asambleas Informativas
          <br>
          Beca Jóvenes Escribiendo el Futuro
        `;

        logoPrincipal.src =
          "LOGO JEF.png";


        imagenInferiorHTML = `
          <img
            src="JEF.jpeg"
            alt="Logo JEF"
            class="imagen-inferior"
          >
        `;

      }


      /*
       * PROGRAMA S072
       */
      else if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S072"
      ){

        tituloPrincipal.innerHTML = `
          Asambleas Informativas
          <br>
          Beca Universal de Educación Básica Rita Cetina Gutiérrez
        `;

        logoPrincipal.src =
          "LOGO BASICA.png";


        imagenInferiorHTML = `
          <img
            src="BASICA.jpeg"
            alt="Logo Básica"
            class="imagen-inferior"
          >
        `;

      }


      /*
       * SI NO SE RECONOCE EL PROGRAMA
       */
      else{

        resetDefault();

      }


      /*
       * FORMATEAR HORA
       *
       * Ejemplo:
       * 08:00:00 a. m. → 08:00 a.m.
       * 14:30:00 p. m. → 14:30 p.m.
       */
      let horarioFormateado = datos.horario || "Pendiente";

      if(horarioFormateado !== "Pendiente"){

        horarioFormateado = horarioFormateado
          .replace(":00 a. m.", " a.m.")
          .replace(":00 p. m.", " p.m.")
          .replace(" a. m.", " a.m.")
          .replace(" p. m.", " p.m.");

      }


      /*
       * MOSTRAR RESULTADO
       */
      div.innerHTML = `

        <div class="card">

          <h2>
            🏫 ${datos.escuela}
          </h2>


          <div class="item">

            <span class="icon">
              📅
            </span>

            <b>Fecha:</b>
            ${datos.fecha || "Pendiente"}

          </div>


          <div class="item">

            <span class="icon">
              🕒
            </span>

            <b>Horario:</b>
            ${horarioFormateado}

          </div>


          <div class="item">

            <span class="icon">
              🏢
            </span>

            <b>Sede:</b>
            ${datos.sede || "Pendiente"}

          </div>


          <div class="item">

            <span class="icon">
              📍
            </span>

            <b>Dirección:</b>
            ${datos.direccion || "Pendiente"}

          </div>

        </div>


        ${imagenInferiorHTML}

      `;

    }

  }


  catch(error){

    console.error(error);

    div.innerHTML = `
      <p class="error">
        ⚠️ Error al consultar información
      </p>
    `;

    resetDefault();

  }

}

</script>

</body>
</html>
