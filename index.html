
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrega de Tarjetas - Becas Bienestar</title>

<style>

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f7f2f4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:550px;
  background:white;
  border-radius:25px;
  padding:35px;
  box-shadow:0 5px 20px rgba(0,0,0,0.12);
  text-align:center;
}

h1{
  color:#7a1f3d;
  font-size:34px;
  margin-bottom:10px;
  line-height:1.4;
}

.subtitulo{
  font-size:20px;
  color:#444;
  margin-bottom:30px;
  line-height:1.5;
}

input{
  width:100%;
  padding:18px;
  font-size:24px;
  border-radius:15px;
  border:2px solid #d6c5cb;
  box-sizing:border-box;
  text-align:center;
}

input:focus{
  outline:none;
  border-color:#7a1f3d;
  box-shadow:0 0 8px rgba(122,31,61,0.25);
}

button{
  width:100%;
  margin-top:20px;
  padding:18px;
  background:#7a1f3d;
  color:white;
  border:none;
  border-radius:15px;
  font-size:26px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#5e1730;
}

.card{
  margin-top:30px;
  background:#faf5f7;
  border-radius:20px;
  padding:25px;
  text-align:left;
  border:1px solid #eadde2;
}

.card h2{
  color:#7a1f3d;
  margin-top:0;
  margin-bottom:20px;
}

.item{
  margin-bottom:18px;
  font-size:20px;
  color:#333;
  line-height:1.5;
}

.icon{
  font-size:24px;
  margin-right:10px;
}

.error{
  margin-top:20px;
  color:#c62828;
  font-size:22px;
  font-weight:bold;
}

.loader{
  margin-top:20px;
  font-size:22px;
  color:#7a1f3d;
}

.footer{
  margin-top:25px;
  font-size:16px;
  color:#777;
}

.imagen-inferior{
  width:100%;
  max-width:280px;
  height:auto;
  margin:25px auto 0 auto;
  display:block;
  border-radius:12px;
}


/* ==========================================
   TARJETA FACEBOOK
   ========================================== */

.facebook-container{
  margin-top:10px;
}

.facebook-message{
  font-size:19px;
  color:#333;
  line-height:1.4;
  margin-bottom:12px;
}

.facebook-card{
  border:1px solid #ddd;
  border-radius:14px;
  background:white;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
}

.facebook-card:hover{
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
  transform:translateY(-1px);
}

.facebook-card-top{
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
}

.facebook-icon{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#1877F2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  flex-shrink:0;
}

.facebook-info{
  min-width:0;
}

.facebook-title{
  font-size:18px;
  font-weight:bold;
  color:#333;
  margin-bottom:5px;
}

.facebook-url{
  font-size:15px;
  color:#777;
  word-break:break-all;
}

.facebook-button{
  display:block;
  margin:0 18px 18px 18px;
  padding:12px;
  background:#1877F2;
  color:white;
  text-align:center;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;
}

.facebook-button:hover{
  background:#166fe5;
}

.link-facebook{
  color:#7a1f3d;
  font-weight:bold;
  text-decoration:underline;
}


/* ==========================================
   CANAL DE WHATSAPP
   ========================================== */

.whatsapp-container{
  margin-top:30px;
  text-align:center;
}

.whatsapp-title{
  font-size:22px;
  color:#7a1f3d;
  line-height:1.4;
  font-weight:bold;
  margin-bottom:10px;
}

.whatsapp-message{
  font-size:19px;
  color:#333;
  line-height:1.5;
  margin-bottom:15px;
}

.whatsapp-link{
  display:block;
  text-decoration:none;
  cursor:pointer;
}

.imagen-canal{
  width:100%;
  max-width:320px;
  height:auto;
  margin:0 auto;
  display:block;
  border-radius:12px;
  transition:0.2s;
}

.imagen-canal:hover{
  transform:scale(1.02);
}

</style>
</head>


<body>

<div class="container">

  <!-- LOGO PRINCIPAL INICIAL -->

  <img
    id="logoPrincipal"
    src="CNBBBJ.png"
    alt="Logo CNBBBJ"
    style="max-width:100%;height:auto;margin-bottom:15px;"
  >

  <h1 id="tituloPrincipal">
    Entrega de Tarjetas
    <br>
    Beca Universal de Educación Media Superior "Benito Juárez"
    y Beca "Jóvenes Escribiendo el Futuro"
  </h1>

  <div class="subtitulo">
    Coloca la clave de la escuela para conocer la programación.
  </div>

  <input
    type="text"
    id="cct"
    placeholder="Ingresa tu CCT"
  >

  <button onclick="buscar()">
    🔎 CONSULTAR
  </button>

  <div id="resultado"></div>

  <div class="footer">
    Becas Bienestar<br>
    Coordinación Nacional<br>
    Hidalgo
  </div>

</div>



<script>

/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwGbC7oC-q0KgIE-HVFerP6yJlPxaibDS_5YA7lMOcDrES8x1A2UxUaZ3t2LDDpxhsU/exec";


/* ==========================================================
   CONFIGURACIÓN CANAL DE WHATSAPP
   ========================================================== */

const URL_CANAL_WHATSAPP =
  "https://whatsapp.com/channel/0029Vb6LSDJ30LKMPuEQML2n";


/* ==========================================================
   FUNCIÓN PARA MOSTRAR EL CANAL DE WHATSAPP
   ========================================================== */

function mostrarCanalWhatsApp(){

  return `
    <div class="whatsapp-container">

      <div class="whatsapp-title">
        ¡Mantente al tanto de tu beca!
      </div>

      <div class="whatsapp-message">
        Sigue nuestro canal de WhatsApp y recibe información,
        avisos y actualizaciones importantes 👇🏻
      </div>

      <a
        href="${URL_CANAL_WHATSAPP}"
        target="_blank"
        rel="noopener noreferrer"
        class="whatsapp-link"
      >

        <img
          src="./CANAL.jpg"
          alt="Sigue nuestro canal de WhatsApp"
          class="imagen-canal"
        >

      </a>

    </div>
  `;
}


/* ==========================================================
   ID ANÓNIMO DEL NAVEGADOR / DISPOSITIVO
   ========================================================== */

const VISITOR_ID_KEY =
  "asambleas_cct_visitor_id_v3";

const STATS_QUEUE_KEY =
  "asambleas_cct_stats_queue_v1";

const STATS_BATCH_SIZE = 10;
const STATS_SEND_DELAY_MS = 700;

let statsSendTimer = null;
let statsSending = false;


function generarVisitorId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ){
    return "U-" + window.crypto.randomUUID();
  }

  return (
    "U-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2)
  );
}


function obtenerVisitorId(){

  try{

    let visitorId =
      localStorage.getItem(VISITOR_ID_KEY);

    if(!visitorId){

      visitorId = generarVisitorId();

      localStorage.setItem(
        VISITOR_ID_KEY,
        visitorId
      );
    }

    return visitorId;

  }catch(error){

    return generarVisitorId();
  }
}


/* ==========================================================
   ESTADÍSTICAS - COLA LOCAL Y ENVÍO POR LOTES
   ========================================================== */

function leerColaEstadisticas(){

  try{

    const texto =
      localStorage.getItem(STATS_QUEUE_KEY);

    if(!texto){
      return [];
    }

    const datos =
      JSON.parse(texto);

    return Array.isArray(datos)
      ? datos
      : [];

  }catch(error){

    return [];
  }
}


function guardarColaEstadisticas(cola){

  try{

    localStorage.setItem(
      STATS_QUEUE_KEY,
      JSON.stringify(cola)
    );

    return true;

  }catch(error){

    return false;
  }
}


function agregarEstadisticaLocal(cct, resultado, instante){

  const evento = {
    t: instante || new Date().toISOString(),
    id: obtenerVisitorId(),
    cct: String(cct || "").trim().toUpperCase(),
    resultado: String(resultado || "SIN_RESULTADO")
  };

  let cola = leerColaEstadisticas();

  cola.push(evento);

  if(cola.length > 100){
    cola = cola.slice(-100);
  }

  if(!guardarColaEstadisticas(cola)){

    enviarLoteEstadisticas([evento]);
    return;
  }

  if(cola.length >= STATS_BATCH_SIZE){
    enviarLoteEstadisticas();
    return;
  }

  programarEnvioEstadisticas();
}


function programarEnvioEstadisticas(){

  if(statsSendTimer !== null){
    return;
  }

  statsSendTimer = setTimeout(function(){

    statsSendTimer = null;
    enviarLoteEstadisticas();

  }, STATS_SEND_DELAY_MS);
}


async function enviarLoteEstadisticas(eventosForzados){

  if(statsSending){
    return;
  }

  let cola = leerColaEstadisticas();

  if(eventosForzados && eventosForzados.length){
    cola = eventosForzados.slice(0, STATS_BATCH_SIZE);
  }

  if(!cola.length){
    return;
  }

  const lote =
    cola.slice(0, STATS_BATCH_SIZE);

  statsSending = true;

  try{

    const body = new URLSearchParams();

    body.set("action", "registrar_lote");
    body.set("payload", JSON.stringify(lote));

    const respuesta = await fetch(
      URL_APPS_SCRIPT,
      {
        method: "POST",
        body: body,
        keepalive: true,
        cache: "no-store"
      }
    );

    const datos = await respuesta.json();

    if(datos && datos.ok){

      const actual = leerColaEstadisticas();

      const enviadosIds =
        new Set(
          lote.map(function(evento){
            return [
              evento.t,
              evento.id,
              evento.cct,
              evento.resultado
            ].join("|");
          })
        );

      const restante = actual.filter(function(evento){

        const clave = [
          evento.t,
          evento.id,
          evento.cct,
          evento.resultado
        ].join("|");

        return !enviadosIds.has(clave);
      });

      guardarColaEstadisticas(restante);

      if(restante.length){
        setTimeout(function(){
          enviarLoteEstadisticas();
        }, 100);
      }

    }

  }catch(error){

    console.warn(
      "No se pudo enviar el lote de estadísticas:",
      error
    );

  }finally{

    statsSending = false;
  }
}


window.addEventListener("visibilitychange", function(){

  if(document.visibilityState === "hidden"){

    enviarLoteEstadisticas();
  }
});


window.addEventListener("pagehide", function(){

  enviarLoteEstadisticas();
});


enviarLoteEstadisticas();


/* ==========================================
   DETECTAR LINK DE FACEBOOK
   ========================================== */

function convertirLinks(texto){

  if(!texto){
    return "";
  }

  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const coincidencia = texto.match(urlRegex);

  if(!coincidencia){
    return texto;
  }

  const url = coincidencia[0];

  const mensaje =
    texto.substring(
      0,
      texto.indexOf(url)
    ).trim();

  if(
    url.includes("facebook.com") ||
    url.includes("fb.com")
  ){

    return `
      <div class="facebook-container">

        ${
          mensaje
          ? `
            <div class="facebook-message">
              ${mensaje}
            </div>
          `
          : ""
        }

        <div
          class="facebook-card"
          onclick="window.open('${url}','_blank')"
        >

          <div class="facebook-card-top">

            <div class="facebook-icon">
              f
            </div>

            <div class="facebook-info">

              <div class="facebook-title">
                Perfil de Facebook
              </div>

              <div class="facebook-url">
                ${url}
              </div>

            </div>

          </div>

          <a
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
            class="facebook-button"
            onclick="event.stopPropagation();"
          >
            Ver perfil de Facebook
          </a>

        </div>
      </div>
    `;
  }

  return `
    ${mensaje}
    <a
      href="${url}"
      target="_blank"
      rel="noopener noreferrer"
      class="link-facebook"
    >
      ${url}
    </a>
  `;
}


/* ==========================================
   BUSCAR
   ========================================== */

async function buscar(){

  const cct =
    document
      .getElementById("cct")
      .value
      .trim()
      .toUpperCase();

  const div =
    document.getElementById("resultado");

  const logoPrincipal =
    document.getElementById("logoPrincipal");

  const tituloPrincipal =
    document.getElementById("tituloPrincipal");

  const tituloOriginal = `
    Entrega de Tarjetas
    <br>
    Beca Universal de Educación Media Superior "Benito Juárez"
    y Beca "Jóvenes Escribiendo el Futuro"
  `;

  const logoOriginal =
    "CNBBBJ.png";

  function resetDefault(){

    logoPrincipal.src = logoOriginal;
    logoPrincipal.alt = "Logo CNBBBJ";

    tituloPrincipal.innerHTML =
      tituloOriginal;
  }

  if(!cct){

    div.innerHTML = `
      <p class="error">
        ⚠️ Ingresa tu CCT
      </p>
    `;

    resetDefault();
    return;
  }

  div.innerHTML = `
    <p class="loader">
      ⏳ Consultando información...
    </p>
  `;

  const instanteConsulta =
    new Date().toISOString();

  try{

    const respuesta =
      await fetch(
        URL_APPS_SCRIPT +
        "?action=consulta" +
        "&cct=" +
        encodeURIComponent(cct) +
        "&t=" +
        new Date().getTime(),
        {
          cache:"no-store"
        }
      );

    const datos =
      await respuesta.json();


    agregarEstadisticaLocal(
      cct,
      datos.error
        ? String(datos.error)
        : "ENCONTRADO",
      instanteConsulta
    );


    if(datos.error){

      div.innerHTML = `
        <p class="error">
          ❌ ${datos.error}
        </p>

        ${mostrarCanalWhatsApp()}
      `;

      resetDefault();

    }else{

      let imagenInferiorHTML = "";


      /* ==========================================
         PROGRAMA S311 - BUEMS
         ========================================== */

      if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S311"
      ){

        tituloPrincipal.innerHTML = `
          Entrega de Tarjetas
          <br>
          Beca Universal de Educación Media Superior "Benito Juárez"
        `;

        /* LOGO SUPERIOR EMS */

        logoPrincipal.src =
          "LOGO EMS.png";

        logoPrincipal.alt =
          "Logo EMS";

        /* IMAGEN INFERIOR EMS */

        imagenInferiorHTML = `
          <img
            src="EMS.jpeg"
            alt="Imagen EMS"
            class="imagen-inferior"
          >
        `;

      }


      /* ==========================================
         PROGRAMA S283 - JEF
         ========================================== */

      else if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S283"
      ){

        tituloPrincipal.innerHTML = `
          Entrega de Tarjetas
          <br>
          Beca "Jóvenes Escribiendo el Futuro"
        `;

        /* LOGO SUPERIOR JEF */

        logoPrincipal.src =
          "LOGO JEF.png";

        logoPrincipal.alt =
          "Logo JEF";

        /* IMAGEN INFERIOR JEF */

        imagenInferiorHTML = `
          <img
            src="JEF.jpeg"
            alt="Imagen JEF"
            class="imagen-inferior"
          >
        `;

      }


      /* ==========================================
         PROGRAMA S072 - BÁSICA
         ========================================== */

      else if(
        String(datos.columnaC || "")
          .trim()
          .toUpperCase() === "S072"
      ){

        tituloPrincipal.innerHTML = `
          Asambleas Informativas
          <br>
          Beca Universal de Educación Básica “Rita Cetina”
          <br>
          Hidalgo
        `;

        /* LOGO SUPERIOR BÁSICA */

        logoPrincipal.src =
          "LOGO BASICO.png";

        logoPrincipal.alt =
          "Logo Básica";

        /* IMAGEN INFERIOR BÁSICA */

        imagenInferiorHTML = `
          <img
            src="BASICA.jpeg"
            alt="Imagen Básica"
            class="imagen-inferior"
          >
        `;

      }

      else{

        resetDefault();

      }


      /* ==========================================
         FORMATEAR HORA
         ========================================== */

      let horarioFormateado =
        datos.horario || "Pendiente";

      if(
        horarioFormateado !==
        "Pendiente"
      ){

        horarioFormateado =
          horarioFormateado
            .replace(":00 a. m."," a.m.")
            .replace(":00 p. m."," p.m.")
            .replace(" a. m."," a.m.")
            .replace(" p. m."," p.m.");
      }


      /* ==========================================
         MOSTRAR RESULTADO
         ========================================== */

      div.innerHTML = `

        <div class="card">

          <h2>
            🏫 ${datos.escuela}
          </h2>

          <div class="item">
            <span class="icon">📅</span>
            <b>Fecha:</b>
            ${datos.fecha || "Pendiente"}
          </div>

          <div class="item">
            <span class="icon">🕒</span>
            <b>Horario:</b>
            ${horarioFormateado}
          </div>

          <div class="item">
            <span class="icon">🏢</span>
            <b>Sede:</b>
            ${datos.sede || "Pendiente"}
          </div>

          <div class="item">
            <span class="icon">📍</span>
            <b>Dirección:</b>
            ${convertirLinks(
              datos.direccion || "Pendiente"
            )}
          </div>

        </div>

        <!-- CANAL DE WHATSAPP -->

        ${mostrarCanalWhatsApp()}

        <!-- IMAGEN CORRESPONDIENTE AL PROGRAMA -->

        ${imagenInferiorHTML}

      `;
    }

  }catch(error){

    console.error(error);

    div.innerHTML = `
      <p class="error">
        ⚠️ Error al consultar información
      </p>

      ${mostrarCanalWhatsApp()}
    `;

    resetDefault();
  }

}

</script>


</body>
</html>
